<div id="gamesWindow" class="app-window games-window">
    <div class="app-titlebar games-titlebar">
        <button id="gamesClose" class="window-close games-close" title="Close"></button>
        <h1>GAMES</h1>
    </div>
    <div class="games-content">
        <div class="games-heading">NEXUS GAMES</div>
        <p class="games-subtitle">Take a break, explorer.</p>
        <div class="games-grid">
            <button class="game-card" data-game="tictactoe">
                <span class="game-icon">✕◯</span>
                <span class="game-name">TIC TAC TOE</span>
                <span class="game-desc">You vs NOVA</span>
            </button>
            <button class="game-card" data-game="memory">
                <span class="game-icon">▦</span>
                <span class="game-name">NEXUS MEMORY</span>
                <span class="game-desc">Match the system traces</span>
            </button>
        </div>
    </div>
</div>
