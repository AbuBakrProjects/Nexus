<div id="terminalWindow" class="terminal-window">

    <div id="terminalTitlebar" class="terminal-titlebar">

        <div class="terminal-buttons">

            <button
                id="terminalClose"
                class="close-button"
                title="Close"
            ></button>

            <button
                id="terminalMaximize"
                class="maximize-button"
                title="Maximize"
            ></button>

        </div>

        <h1>TERMINAL</h1>

    </div>

    <div id="terminalBody" class="terminal-body">

        <div id="terminalOutput">

            <div class="terminal-line terminal-system">
                NEXUS NODE 01
            </div>

            <div class="terminal-line terminal-system">
                SYSTEM READY.
            </div>

            <div class="terminal-line terminal-system">
                Type 'help' for available commands.
            </div>

        </div>

        <div class="terminal-input-line">

            <span
                id="terminalPrompt"
                class="terminal-prompt"
            >
                nexus@node:~$
            </span>

            <input
                id="commandInput"
                type="text"
                autocomplete="off"
                spellcheck="false"
            >

        </div>

    </div>

</div>
