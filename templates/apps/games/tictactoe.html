<div id="ticTacToeWindow" class="game-window ttt-window">
    <div class="app-titlebar ttt-titlebar">
        <button id="ticTacToeClose" class="window-close game-close" title="Close"></button>
        <h1>TIC TAC TOE</h1>
    </div>
    <div class="game-content ttt-content">
        <div class="game-status" id="tttStatus">YOUR TURN • X</div>
        <div class="buttons-TTT">
            <button class="ttt-box" data-index="0"></button>
            <button class="ttt-box" data-index="1"></button>
            <button class="ttt-box" data-index="2"></button>
            <button class="ttt-box" data-index="3"></button>
            <button class="ttt-box" data-index="4"></button>
            <button class="ttt-box" data-index="5"></button>
            <button class="ttt-box" data-index="6"></button>
            <button class="ttt-box" data-index="7"></button>
            <button class="ttt-box" data-index="8"></button>
        </div>
        <div id="tttResult" class="game-result"></div>
        <button id="tttReset" class="game-reset">NEW ROUND</button>
    </div>
</div>
